name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: job_automate/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clearhire_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d clearhire_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENVIRONMENT: test
      DEBUG: "false"
      AUTH_ENABLED: "false"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clearhire_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_PROVIDER: local
      EMBEDDING_LOAD_LOCAL_MODEL: "false"
      SECRET_KEY: test-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout mirror submodule
        run: git submodule update --init --remote

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: job_automate/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend test suite
        run: pytest tests -q
