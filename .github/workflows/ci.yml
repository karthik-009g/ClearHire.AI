name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      EMBEDDING_LOAD_LOCAL_MODEL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  deployment-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: python -m pip install pyyaml
      - name: Validate Kubernetes YAML syntax and Compose build paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path("deployment/kubernetes").glob("*.yaml"):
              documents = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              assert documents and all(document is not None for document in documents), path

          compose = yaml.safe_load(Path("deployment/docker/docker-compose.yml").read_text(encoding="utf-8"))
          assert compose["services"]["postgres"]["image"].startswith("pgvector/pgvector:"), "PostgreSQL image must include pgvector"
          assert "./init-db.sql" not in str(compose), "legacy bootstrap SQL must not run before Alembic migrations"
          compose_dir = Path("deployment/docker")
          for service in compose["services"].values():
              build = service.get("build")
              if not build:
                  continue
              context = (compose_dir / build["context"]).resolve()
              dockerfile = (context / build["dockerfile"]).resolve()
              assert dockerfile.is_file(), dockerfile
          PY
      - name: Validate Docker Compose configuration
        run: docker compose -f deployment/docker/docker-compose.yml config --quiet
      - name: Validate Kubernetes manifests against API schemas
        run: go run github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7 -strict -summary deployment/kubernetes

  container-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          tags: clearhire/backend:ci
          load: true
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: clearhire/backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.frontend
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8000
          tags: clearhire/frontend:ci
          load: true
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: clearhire/frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
