apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearhire-frontend
  labels:
    app: clearhire-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clearhire-frontend
  template:
    metadata:
      labels:
        app: clearhire-frontend
    spec:
      containers:
        - name: frontend
          image: clearhire/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: clearhire-frontend
spec:
  selector:
    app: clearhire-frontend
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
