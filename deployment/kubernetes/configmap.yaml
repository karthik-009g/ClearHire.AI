apiVersion: v1
kind: ConfigMap
metadata:
  name: clearhire-config
data:
  ENVIRONMENT: production
  STORAGE_PROVIDER: s3
  STORAGE_BUCKET: replace-with-private-bucket-name
  STORAGE_REGION: us-east-1
  EMBEDDING_LOAD_LOCAL_MODEL: "false"
  NEXT_PUBLIC_ENV: production
  CORS_ALLOWED_ORIGINS: https://app.clearhire.example.com
  DEBUG: "false"
